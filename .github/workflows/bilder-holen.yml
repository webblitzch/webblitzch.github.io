name: Tally-Bilder speichern
on:
  push:
    branches: [main]
    paths: ["vorschau/**/index.html"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bilder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/bilder_holen.py
      - name: Änderungen speichern
        run: |
          if [ -n "$(git status --porcelain vorschau)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vorschau
            git commit -m "Tally-Bilder lokal gespeichert"
            git push
          fi
